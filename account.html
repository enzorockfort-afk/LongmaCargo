<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Личный кабинет — Longma</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F8EFE0">
  <link rel="icon" type="image/webp" href="assets/app-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11">
  <link rel="stylesheet" href="portal.css?v=11">
</head>
<body data-page="account">
<main id="main">
  <!-- вход и регистрация -->
  <section class="sec sec-first" id="authView" hidden>
    <div class="auth">
      <div class="auth-l">
        <h1 class="h1 h1-page" data-i="acc.h">Личный кабинет</h1>
        <p class="lead" data-i="acc.lead">Оформляйте заказы, подтверждайте цену и следите за каждой посылкой — от выкупа до встречи.</p>
        <ul class="auth-perks">
          <li><svg class="ic"><use href="#i-box"/></svg><span data-i="acc.p1">Все заказы и их статусы в одном месте</span></li>
          <li><svg class="ic"><use href="#i-pin"/></svg><span data-i="acc.p2">Трек-номер для каждой посылки</span></li>
          <li><svg class="ic"><use href="#i-bell"/></svg><span data-i="acc.p3">Видно, когда статус поменялся</span></li>
        </ul>
      </div>
      <div class="auth-box">
        <div class="seg auth-tabs" role="tablist">
          <label><input type="radio" name="authTab" value="in" checked><span data-i="acc.in">Вход</span></label>
          <label><input type="radio" name="authTab" value="up"><span data-i="acc.up">Регистрация</span></label>
        </div>
        <form id="inForm" class="stack" novalidate>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
          <label class="field"><span data-i="acc.pass">Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
          <p class="err" role="alert"></p>
          <button class="btn btn-red btn-block"><span data-i="acc.in">Вход</span></button>
          <p class="demo-hint" id="demoHint" hidden></p>
        </form>
        <form id="upForm" class="stack" novalidate hidden>
          <label class="field"><span data-i="f.name">Имя</span><input name="name" autocomplete="name" required></label>
          <div class="row2">
            <label class="field"><span data-i="acc.phone">Телефон</span><input name="phone" type="tel" autocomplete="tel" placeholder="+373"></label>
            <label class="field"><span>Telegram</span><input name="telegram" data-ph="f.tgPh" placeholder="@username или номер" required></label>
          </div>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
          <label class="field"><span data-i="acc.passNew">Пароль, от 6 символов</span><input name="password" type="password" autocomplete="new-password" minlength="6" required></label>
          <label class="check"><input type="checkbox" name="agree" required><span data-i="acc.agree">Согласен на обработку моих данных для доставки заказов</span></label>
          <p class="err" role="alert"></p>
          <button class="btn btn-red btn-block"><span data-i="acc.create">Создать кабинет</span></button>
        </form>
      </div>
    </div>
  </section>

  <!-- кабинет -->
  <section class="sec sec-first" id="cabView" hidden>
    <div class="cab-head">
      <div>
        <h1 class="h1 h1-page" id="cabName"></h1>
        <button class="code-chip" id="codeChip" type="button"><small data-i="acc.code">Код клиента</small><b id="cabCode"></b><svg class="ic"><use href="#i-copy"/></svg></button>
      </div>
      <div class="cab-acts">
        <a class="btn btn-red" href="order.html"><svg class="ic"><use href="#i-plus"/></svg><span data-i="acc.new">Новый заказ</span></a>
        <a class="btn btn-ink" id="adminLink" href="admin.html" hidden><span data-i="acc.admin">Админка</span></a>
        <button class="btn btn-line" id="outBtn" type="button"><svg class="ic"><use href="#i-logout"/></svg><span data-i="acc.out">Выйти</span></button>
      </div>
    </div>
    <p class="banner" id="banner" hidden></p>
    <div class="kpis" id="kpis"></div>
    <h2 class="h3" data-i="acc.orders">Мои заказы</h2>
    <div class="olist" id="olist"></div>

    <details class="profile">
      <summary data-i="acc.profile">Мои данные</summary>
      <form id="profForm" class="stack" novalidate>
        <div class="row2">
          <label class="field"><span data-i="f.name">Имя</span><input name="name" autocomplete="name"></label>
          <label class="field"><span data-i="acc.phone">Телефон</span><input name="phone" type="tel"></label>
        </div>
        <label class="field"><span>Telegram</span><input name="telegram" data-ph="f.tgPh" placeholder="@username или номер"></label>
        <button class="btn btn-ink btn-sm"><span data-i="acc.save">Сохранить</span></button>
      </form>
    </details>
  </section>
  <div class="loading" id="loading"><span class="crop crop-panda"><img src="assets/panda.webp" alt=""></span></div>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js?v=11"></script>
<script src="i18n.js?v=11"></script>
<script src="store.js?v=11"></script>
<script src="app.js?v=11"></script>
<script src="orders-ui.js?v=11"></script>
<script src="account.js?v=11"></script>
</body>
</html>
