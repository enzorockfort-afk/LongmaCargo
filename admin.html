<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Админка — Longma</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F8EFE0">
  <link rel="icon" type="image/webp" href="assets/app-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="stylesheet" href="portal.css?v=9">
</head>
<body data-page="admin">
<main id="main">
  <section class="sec sec-first" id="guard" hidden>
    <div class="auth-box guard-box">
      <h1 class="h2">Админка Longma</h1>
      <p class="sub" id="guardMsg">Войдите аккаунтом администратора.</p>
      <form id="admIn" class="stack" novalidate>
        <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
        <label class="field"><span>Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
        <p class="err" role="alert"></p>
        <button class="btn btn-red btn-block">Войти</button>
        <p class="demo-hint" id="admDemo" hidden></p>
      </form>
    </div>
  </section>

  <section class="sec sec-first" id="adm" hidden>
    <div class="cab-head">
      <h1 class="h1 h1-page">Заказы</h1>
      <div class="cab-acts">
        <div class="seg adm-tabs"><label><input type="radio" name="admTab" value="orders" checked><span>Заказы</span></label><label><input type="radio" name="admTab" value="clients"><span>Клиенты</span></label></div>
        <button class="btn btn-line" id="admRefresh" type="button">Обновить</button>
      </div>
    </div>
    <div class="kpis" id="admKpis"></div>
    <div id="ordersTab">
      <div class="adm-bar">
        <div class="chips" id="chips"></div>
        <input class="adm-q" id="admQ" type="search" placeholder="Номер, имя, Telegram, код клиента" aria-label="Поиск">
      </div>
      <div class="adm-list" id="admList"></div>
    </div>
    <div id="clientsTab" hidden><div class="adm-list" id="clientList"></div></div>
  </section>
  <div class="loading" id="loading"><span class="crop crop-panda"><img src="assets/panda.webp" alt=""></span></div>
</main>

<dialog class="modal" id="om" aria-labelledby="omTitle">
  <form id="omForm" novalidate>
    <header class="modal-h"><h2 id="omTitle"></h2><button type="button" class="ic-x" data-close aria-label="Закрыть"><svg class="ic"><use href="#i-close"/></svg></button></header>
    <div class="modal-b">
      <div class="om-client" id="omClient"></div>
      <div class="om-items" id="omItems"></div>
      <div class="row2">
        <label class="field"><span>Статус</span><select name="status" id="omStatus"></select></label>
        <div class="field"><span>Доставка</span>
          <div class="seg"><label><input type="radio" name="method" value="air"><span>Самолёт</span></label><label><input type="radio" name="method" value="sea"><span>Море</span></label></div>
        </div>
      </div>
      <div class="row3">
        <label class="field"><span>Цена товара, ¥</span><input name="goodsCny" type="number" inputmode="decimal" min="0" step="0.01"></label>
        <label class="field"><span>Вес, кг</span><input name="weight" type="number" inputmode="decimal" min="0" step="0.01"></label>
        <label class="field"><span>Итог вручную, лей</span><input name="finalLei" type="number" inputmode="numeric" min="0" placeholder="авто"></label>
      </div>
      <p class="om-calc" id="omCalc"></p>
      <div class="om-paid" id="omPaid" hidden></div>
      <label class="field"><span>Ссылка на оплату (RollyPay, maib, Paynet — клиент увидит кнопку «Оплатить картой»)</span><input name="payUrl" type="url" autocomplete="off" placeholder="https://"></label>
      <label class="field"><span>Сообщение клиенту (видно в кабинете)</span><textarea name="managerNote" rows="2" placeholder="Например: оплата на карту, реквизиты пришлём в Telegram"></textarea></label>
      <div class="field"><span>Фото товара (до 4, видны клиенту)</span>
        <div class="om-photos" id="omPhotos"></div>
        <label class="btn btn-line btn-sm om-add"><svg class="ic"><use href="#i-photo"/></svg>Добавить фото<input type="file" id="omFiles" accept="image/*" multiple hidden></label>
      </div>
      <fieldset class="om-private">
        <legend>Только для вас — клиент не видит</legend>
        <div class="row2">
          <label class="field"><span>Трек у партнёра (Meest и т.п.)</span><input name="partnerTrack" autocomplete="off"></label>
          <label class="field"><span>Ссылка на заказ у партнёра</span><input name="partnerLink" type="url" autocomplete="off"></label>
        </div>
        <label class="field"><span>Заметка</span><textarea name="privateNote" rows="2"></textarea></label>
      </fieldset>
      <p class="err" id="omErr" role="alert"></p>
    </div>
    <footer class="modal-f">
      <button type="button" class="btn btn-line btn-sm" id="omDel">Удалить</button>
      <span class="sp"></span>
      <a class="btn btn-line btn-sm" id="omTg" target="_blank" rel="noopener" hidden>Написать клиенту</a>
      <button class="btn btn-red btn-sm">Сохранить</button>
    </footer>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js?v=9"></script>
<script src="i18n.js?v=9"></script>
<script src="store.js?v=9"></script>
<script src="app.js?v=9"></script>
<script src="orders-ui.js?v=9"></script>
<script src="admin.js?v=9"></script>
</body>
</html>
