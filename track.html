<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Отследить посылку — Longma</title>
  <meta name="description" content="Узнайте, где ваша посылка из Китая: введите номер заказа Longma.">
  <meta name="theme-color" content="#F8EFE0">
  <link rel="icon" type="image/webp" href="assets/app-icon.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="stylesheet" href="portal.css?v=9">
</head>
<body data-page="track">
<main id="main">
  <header class="page-head">
    <h1 class="h1 h1-page" data-i="trk.h">Где моя посылка?</h1>
    <p class="lead" data-i="trk.lead">Введите номер заказа — он начинается с LM и есть в личном кабинете.</p>
  </header>
  <section class="sec sec-tight">
    <form class="trk-form" id="trkForm">
      <label class="sr" for="trkIn" data-i="trk.label">Номер заказа</label>
      <input id="trkIn" name="t" placeholder="LM12345678" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn btn-red"><svg class="ic"><use href="#i-search"/></svg><span data-i="trk.go">Найти</span></button>
    </form>
    <div id="trkOut" aria-live="polite"></div>
  </section>
</main>
<script src="config.js?v=9"></script>
<script src="i18n.js?v=9"></script>
<script src="store.js?v=9"></script>
<script src="app.js?v=9"></script>
<script src="orders-ui.js?v=9"></script>
<script>
(function () {
  const V = window.LM_VIEW, U = window.LM_UI;
  const out = document.getElementById("trkOut");
  const input = document.getElementById("trkIn");
  let last = null;

  function show(t, r) {
    if (r === undefined) return (out.innerHTML = "");
    if (!r) {
      out.innerHTML = `<div class="trk-empty"><span class="crop crop-panda"><img src="assets/panda.webp" alt=""></span>
        <div><b>${V.esc(U.t("trk.none", "Заказ не найден"))}</b><p>${V.esc(U.t("trk.noneT", "Проверьте номер. Если заказ только оформлен, номер есть в личном кабинете."))}</p></div></div>`;
      return;
    }
    out.innerHTML = `<article class="trk-card">
      <header><div><small>${V.esc(U.t("trk.num", "Заказ"))}</small><b class="mono-num">${V.esc(r.track)}</b></div>
        <span class="pill pill-${r.status}">${V.esc(V.name(r.status))}</span></header>
      ${V.progress(r)}
      <div class="trk-meta">
        <span><svg class="ic"><use href="#i-${r.method === "sea" ? "ship" : "plane"}"/></svg>${V.esc(V.method(r.method))}</span>
        <span>${V.esc(U.t("trk.from", "Оформлен"))} ${V.date(r.createdAt)}</span>
      </div>
      ${V.timeline(r)}
    </article>`;
  }

  async function find(t) {
    t = String(t || "").trim().toUpperCase();
    if (!t) return input.focus();
    last = t;
    out.innerHTML = `<div class="trk-card sk"></div>`;
    try {
      const api = await window.LM_DB.ready;
      show(t, await api.orders.byTrack(t));
      history.replaceState(null, "", "?t=" + encodeURIComponent(t));
    } catch (e) {
      out.innerHTML = `<p class="err">${V.esc(window.LM_DB.errorText(e, U.lang()))}</p>`;
    }
  }
  document.getElementById("trkForm").addEventListener("submit", (e) => (e.preventDefault(), find(input.value)));
  U.onLang(() => last && find(last));
  const q = new URLSearchParams(location.search).get("t");
  if (q) (input.value = q), find(q);
})();
</script>
</body>
</html>
